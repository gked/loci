<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loci node</title>
<style>
  /* The app's "inner shell" (app/design/colors_and_type.css; NodeViewer.jsx): a paper card, serif
     title and body, mono type/uid. Web fonts cannot load here (no network), so each family is a
     stack that falls back to what the machine has. */
  :root {
    --surface: #fff; --sunken: #f0eee8; --rule: #e2dfd7;
    --fg: #15130f; --muted: #6b6960; --faint: #a3a097;
    --focus: #1f3a68; --info: #2f6fc4; --success: #1f7a55; --warn: #b8860b; --danger: #c0392b;
    --serif: "EB Garamond", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { padding: 2px; font: 13px/1.4 var(--sans); color: var(--fg); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(20,18,12,.04), 0 2px 6px rgba(20,18,12,.04); }
  .bar { display: flex; align-items: flex-start; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--rule); font: 11px var(--mono); color: var(--muted); }
  .bar .info { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 26px; }
  .bar .actions { display: flex; gap: 6px; flex: none; }
  .bar .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .badge { font: 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 2px; background: var(--sunken); }
  .badge.saved { color: var(--success); border-color: var(--success); background: transparent; }
  .badge.draft { color: var(--warn); border-color: var(--warn); background: transparent; }
  .grow { flex: 1; }
  .btn { padding: 5px 11px; border-radius: 4px; border: 1px solid var(--rule); background: transparent; color: var(--muted); font: 12px var(--sans); }
  .btn:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
  .btn.primary { background: var(--focus); border-color: var(--focus); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #17305a; color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }

  .doc { padding: 18px 24px 22px; }
  h1 { margin: 0 0 10px; font: 600 28px/1.15 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; border-radius: 3px; background: var(--sunken); border: 1px solid var(--rule); font: 11px var(--sans); }
  .pill .k { font: 9px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 1px 4px; background: #fff; border-radius: 2px; }
  .tag { padding: 3px 8px; border-radius: 3px; background: #fff; border: 1px solid var(--rule); font: 11px var(--mono); color: var(--muted); }
  .tag.domain { font: italic 11px var(--sans); }
  .summary { margin: 12px 0 0; font: italic 16px/1.5 var(--serif); color: var(--muted); }

  .rels { margin-top: 16px; }
  .label { font: 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .rel { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid var(--rule); font-size: 12.5px; }
  .rel:first-of-type { border-top: 0; }
  .rel .rt { font: 11px var(--mono); color: var(--muted); min-width: 84px; }
  .rel .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .rel .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rel .miss { font: italic 11px var(--sans); color: var(--danger); }
  .rel.off .title, .rel.off .rt { text-decoration: line-through; opacity: .5; }
  .rel .x { border: 0; background: none; color: var(--faint); font-size: 15px; line-height: 1; padding: 0 4px; }
  .rel .x:hover { color: var(--danger); }

  .md { margin-top: 18px; font: 16.5px/1.65 var(--serif); overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md h1, .md h2, .md h3, .md h4 { font-family: var(--serif); line-height: 1.25; margin: 1.3em 0 .4em; }
  .md h1 { font-size: 24px; } .md h2 { font-size: 21px; } .md h3 { font-size: 18px; } .md h4 { font-size: 16.5px; }
  .md p { margin: .7em 0; }
  .md ul, .md ol { margin: .6em 0; padding-left: 1.5em; }
  .md blockquote { margin: .8em 0; padding: 0 0 0 14px; border-left: 3px solid var(--rule); color: var(--muted); }
  .md code { font: .85em var(--mono); background: var(--sunken); padding: 1px 5px; border-radius: 3px; }
  .md pre { margin: .8em 0; padding: 10px 12px; background: var(--sunken); border: 1px solid var(--rule); border-radius: 4px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; font-size: 12.5px; }
  .md hr { border: 0; border-top: 1px solid var(--rule); margin: 1.2em 0; }
  .md a { color: var(--info); text-decoration: underline; cursor: pointer; }
  .md table { border-collapse: collapse; margin: .8em 0; font: 13px var(--sans); display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--rule); padding: 4px 9px; text-align: left; }
  .md th { background: var(--sunken); }
  .empty { color: var(--faint); font-style: italic; }

  .form { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .field label { display: block; margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
  .field input.t { font: 600 22px/1.2 var(--serif); }
  .field textarea.s { font: italic 15px/1.45 var(--serif); resize: vertical; }
  .field textarea.b { font: 13px/1.55 var(--mono); min-height: 220px; resize: vertical; }
  .hint { font: 11px var(--sans); color: var(--faint); margin-top: 3px; }

  .banner { margin-top: 14px; padding: 8px 12px; border-left: 3px solid; border-radius: 0 3px 3px 0; font-size: 12.5px; }
  .banner ul { margin: 4px 0 0; padding-left: 18px; }
  .banner.error { background: #fbeeec; border-color: var(--danger); }
  .banner.warn { background: #fbf5e3; border-color: var(--warn); }
  .banner.ok { background: #e9f4ee; border-color: var(--success); }
  .banner .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .banner code { font: 11.5px var(--mono); }
  .foot { padding: 8px 16px; border-top: 1px solid var(--rule); font: 11px var(--mono); color: var(--faint); display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="card" id="card" data-testid="node-view" data-status="waiting">
  <div class="doc"><p class="empty" id="waiting">Waiting for the draft…</p></div>
</div>

<script>
// Same palette as the app (app/src/constants.js). A user-defined type falls back to the design default.
const TYPE_COLOR = {
  project: "#2f6fc4", task: "#ff8a00", document: "#1fa050", entity: "#e63946",
  conversation: "#2dbfb6", article: "#f4c430", bookmark: "#c062b8", procedure: "#ff6b8a",
  skill: "#c2456a", topic: "#a4421f", event: "#7a5cc1", asset: "#5e7a8c", log: "#8a7f5c",
};
const colorOf = (t) => TYPE_COLOR[t] || "#bab0ac";

// ---------- host connection: JSON-RPC over postMessage, no SDK, no network ----------
const host = window.parent;
let nextId = 1;
const pending = new Map();
const send = (m) => host.postMessage({ jsonrpc: "2.0", ...m }, "*");
const request = (method, params) => new Promise((resolve, reject) => {
  const id = nextId++;
  pending.set(id, { resolve, reject });
  send({ id, method, params });
});

// A tool result's data is in structuredContent when the tool declares an output shape and in the
// text block otherwise (write_vault returns a bare dict). Accept either.
function dataOf(result) {
  if (result && result.structuredContent) return result.structuredContent;
  const block = ((result && result.content) || []).find((c) => c.type === "text");
  try { return block ? JSON.parse(block.text) : null; } catch { return null; }
}
async function callTool(name, args) {
  const r = await request("tools/call", { name, arguments: args });
  const data = dataOf(r);
  if (r.isError) throw new Error((data && data.error) || (r.content && r.content[0] && r.content[0].text) || "The tool failed.");
  return data || {};
}

window.addEventListener("message", (e) => {
  const d = e.data;
  if (e.source !== host || !d || d.jsonrpc !== "2.0") return;
  if (!d.method) {                                   // a response to one of our requests
    const p = pending.get(d.id);
    if (p) { pending.delete(d.id); d.error ? p.reject(new Error(d.error.message || "request failed")) : p.resolve(d.result); }
    return;
  }
  if (d.method === "ui/notifications/tool-result") { const p = dataOf(d.params); if (p && p.draft) load(p); }
  else if ((d.method === "ui/resource-teardown" || d.method === "ping") && d.id != null) send({ id: d.id, result: {} });
});

// ---------- state ----------
const S = {
  original: null,          // the proposal as it arrived, for Reset and for telling the assistant what changed
  draft: null, relations: [], off: new Set(),     // `off`: relation indexes the user removed
  duplicate: null, errors: [], warnings: [], tagWarnings: [],
  mode: "view", status: "draft",                  // status: draft | saving | saved | handoff
  allowDup: false, problem: null, saved: null, handoffTo: null,
  notified: null,         // whether the host took the "saved" message; null until known
  sending: false,
};
const clone = (x) => JSON.parse(JSON.stringify(x));

function load(p) {
  S.original = clone(p);
  S.draft = clone(p.draft);
  S.relations = clone(p.relations || []);
  S.off = new Set();
  S.duplicate = p.duplicate || null;
  S.errors = p.errors || [];
  S.warnings = p.warnings || [];
  S.tagWarnings = p.tag_warnings || [];
  S.mode = "view"; S.status = "draft"; S.allowDup = false; S.problem = null; S.saved = null; S.handoffTo = null;
  render();
}

const edited = () => {
  const o = S.original.draft, d = S.draft;
  return o.title !== d.title || (o.summary || "") !== (d.summary || "") || o.body !== d.body
    || JSON.stringify(o.tags) !== JSON.stringify(d.tags) || S.off.size > 0;
};
const needsChoice = () => S.duplicate && !S.allowDup;
const canSave = () =>
  S.status === "draft" && !S.errors.length && !needsChoice() && (S.draft.title || "").trim().length > 0;

// ---------- DOM helpers (note content only ever goes in through textContent) ----------
function el(tag, props = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "testid") e.setAttribute("data-testid", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of [].concat(kids)) if (k != null && k !== false) e.append(k);
  return e;
}
const txt = (s) => document.createTextNode(s);

// ---------- markdown: block and inline, DOM out ----------
function openLink(url) { request("ui/open-link", { url }).catch(() => {}); }

function inline(src) {
  const out = [];
  const rules = [
    [/^`([^`]+)`/, (m) => el("code", {}, m[1])],
    [/^\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/, (m) => {
      const url = m[2];
      if (!/^https?:/i.test(url)) return el("span", {}, inline(m[1]));        // a vault-relative or file link
      return el("a", { href: "#", title: url, onclick: (ev) => { ev.preventDefault(); openLink(url); } }, inline(m[1]));
    }],
    [/^\*\*([^*]+)\*\*/, (m) => el("strong", {}, inline(m[1]))],
    [/^__([^_]+)__/, (m) => el("strong", {}, inline(m[1]))],
    [/^~~([^~]+)~~/, (m) => el("del", {}, inline(m[1]))],
    [/^\*([^*\s][^*]*)\*/, (m) => el("em", {}, inline(m[1]))],
    [/^_([^_\s][^_]*)_(?![A-Za-z0-9])/, (m) => el("em", {}, inline(m[1]))],
  ];
  let buf = "";
  const flush = () => { if (buf) { out.push(txt(buf)); buf = ""; } };
  for (let i = 0; i < src.length;) {
    const rest = src.slice(i);
    // an underscore inside a word (snake_case) is not emphasis
    const wordInternal = rest[0] === "_" && i > 0 && /[A-Za-z0-9]/.test(src[i - 1]);
    let hit = null;
    if (!wordInternal) for (const [re, make] of rules) { const m = re.exec(rest); if (m) { hit = [m, make]; break; } }
    if (hit) { flush(); out.push(hit[1](hit[0])); i += hit[0][0].length; }
    else { buf += rest[0]; i++; }
  }
  flush();
  return out;
}

function markdown(src) {
  const root = el("div", {});
  const lines = (src || "").replace(/\r\n?/g, "\n").split("\n");
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l || "");
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const startsBlock = (l) => /^(#{1,6}\s|```|>\s?|\s*([-*+]|\d+\.)\s|\s*([-*_])\s*\3\s*\3[\s\-*_]*$)/.test(l);
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = /^```\s*([\w+-]*)\s*$/.exec(line))) {                      // fenced code
      const body = []; i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i++]);
      i++;
      root.append(el("pre", {}, el("code", {}, body.join("\n"))));
    } else if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line))) {
      root.append(el("h" + Math.min(m[1].length, 4), {}, inline(m[2]))); i++;
    } else if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) {
      root.append(el("hr")); i++;
    } else if (/^>\s?/.test(line)) {
      const q = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
      root.append(el("blockquote", {}, [markdown(q.join("\n"))]));
    } else if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const list = el(ordered ? "ol" : "ul");
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ""); i++;
        const task = /^\[([ xX])\]\s+(.*)$/.exec(item);
        const li = el("li");
        if (task) { li.append(el("input", { type: "checkbox", disabled: true, checked: task[1] !== " " }), txt(" ")); item = task[2]; }
        inline(item).forEach((n) => li.append(n));
        list.append(li);
      }
      root.append(list);
    } else if (line.includes("|") && isTableSep(lines[i + 1])) {
      const head = cells(line); i += 2;
      const table = el("table"), thead = el("thead"), tbody = el("tbody");
      thead.append(el("tr", {}, head.map((h) => el("th", {}, inline(h)))));
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
        tbody.append(el("tr", {}, cells(lines[i++]).map((c) => el("td", {}, inline(c)))));
      }
      table.append(thead, tbody); root.append(table);
    } else {
      const para = [line]; i++;
      while (i < lines.length && lines[i].trim() && !startsBlock(lines[i])) para.push(lines[i++]);
      root.append(el("p", {}, inline(para.join(" "))));
    }
  }
  return root;
}

// ---------- render ----------
const card = document.getElementById("card");
const words = (s) => (s || "").trim().split(/\s+/).filter(Boolean).length;

function pills() {
  const d = S.draft, x = d.extra_fields || {};
  const row = el("div", { class: "pills" });
  const pill = (k, v) => row.append(el("span", { class: "pill" }, [el("span", { class: "k" }, k), el("span", {}, String(v))]));
  if (x.status) pill("status", x.status);
  if (x.subtype) pill("subtype", x.subtype);
  for (const [k, v] of Object.entries(x)) {
    if (["status", "subtype", "uid", "has_asset"].includes(k) || v === null || typeof v === "object") continue;
    pill(k.replace(/_/g, " "), String(v).length > 60 ? String(v).slice(0, 59) + "…" : v);
  }
  (d.tags || []).forEach((t) => row.append(el("span", { class: "tag", testid: "nv-tag" }, "#" + t)));
  (d.domains || []).forEach((t) => row.append(el("span", { class: "tag domain" }, t)));
  return row;
}

function relationsBlock() {
  if (!S.relations.length) return null;
  const wrap = el("div", { class: "rels" }, [el("div", { class: "label" }, "Relations")]);
  S.relations.forEach((r, i) => {
    const off = S.off.has(i);
    const remove = S.status === "draft";
    wrap.append(el("div", { class: "rel" + (off ? " off" : ""), testid: "nv-relation", "data-uid": r.uid, "data-off": String(off) }, [
      el("span", { class: "rt" }, r.type || "relates-to"),
      el("span", { class: "dot", style: "background:" + colorOf(r.node_type) }),
      el("span", { class: "title", title: r.uid }, r.title || r.uid),
      r.missing ? el("span", { class: "miss" }, "not in the vault") : null,
      remove ? el("button", {
        class: "x", testid: "nv-relation-toggle", title: off ? "Keep this relation" : "Leave this relation out",
        "aria-label": (off ? "Keep" : "Leave out") + " the relation to " + (r.title || r.uid),
        onclick: () => { off ? S.off.delete(i) : S.off.add(i); render(); },
      }, off ? "↺" : "×") : null,
    ]));
  });
  return wrap;
}

function banners() {
  const out = [];
  if (S.errors.length) {
    out.push(el("div", { class: "banner error", testid: "nv-errors", role: "alert" },
      [el("strong", {}, "This draft cannot be saved yet"), el("ul", {}, S.errors.map((e) => el("li", {}, e))),
       el("div", { class: "hint" }, "Ask the assistant to fix it, or edit the draft in the chat.")]));
  }
  if (S.problem) out.push(el("div", { class: "banner error", testid: "nv-problem", role: "alert" }, S.problem));
  if (S.duplicate && S.status === "draft") {
    const d = S.duplicate;
    out.push(el("div", { class: "banner warn", testid: "nv-duplicate" }, [
      el("strong", {}, "A similar node already exists: "), txt(d.name || d.uid || ""),
      el("div", { class: "row" }, [
        el("button", { class: "btn", testid: "nv-dup-new", onclick: () => { S.allowDup = true; S.duplicate = null; render(); } }, "Save as a new node anyway"),
        el("button", { class: "btn", testid: "nv-dup-update", onclick: handoffUpdate }, "Update the existing node instead"),
      ]),
    ]));
  }
  const notes = [...S.warnings, ...S.tagWarnings];
  if (notes.length && S.status === "draft") {
    out.push(el("div", { class: "banner warn", testid: "nv-warnings" }, el("ul", {}, notes.map((n) => el("li", {}, n)))));
  }
  if (S.status === "saved" && S.saved) {
    const s = S.saved;
    out.push(el("div", { class: "banner ok", testid: "nv-saved", role: "status" }, [
      el("strong", {}, "Saved to your vault"),
      el("div", {}, [txt("uid "), el("code", {}, s.uid), s.path ? txt(" · ") : null, s.path ? el("code", {}, s.path) : null]),
      S.notified === false ? el("div", { class: "hint", testid: "nv-not-notified" }, "The assistant could not be told automatically. Mention it in the chat so it can carry on.") : null,
    ]));
  }
  if (S.status === "handoff") {
    out.push(el("div", { class: "banner ok", testid: "nv-handoff", role: "status" }, "Sent to the assistant: it will update " + (S.handoffTo || "the existing node") + " instead."));
  }
  return out;
}

function form() {
  const d = S.draft;
  const title = el("input", { class: "t", type: "text", value: d.title, testid: "nv-title-input", "aria-label": "Title",
    oninput: (e) => { d.title = e.target.value; saveBtnSync(); },
    // A new title may or may not collide; write_vault decides on the click. Only the banners are
    // redrawn: rebuilding the form here would swallow the click that moved focus out of the title.
    onchange: () => { S.duplicate = null; drawBanners(); saveBtnSync(); } });
  const summary = el("textarea", { class: "s", rows: 2, testid: "nv-summary-input", "aria-label": "Summary", oninput: (e) => { d.summary = e.target.value; } });
  summary.value = d.summary || "";
  const tags = el("input", { type: "text", value: (d.tags || []).join(", "), testid: "nv-tags-input", "aria-label": "Tags",
    oninput: (e) => { d.tags = e.target.value.split(/[,\s]+/).map((t) => t.replace(/^#/, "").trim().toLowerCase()).filter(Boolean); } });
  const body = el("textarea", { class: "b", testid: "nv-body-input", "aria-label": "Body", spellcheck: "true", oninput: (e) => { d.body = e.target.value; } });
  body.value = d.body || "";
  return el("div", { class: "form" }, [
    el("div", { class: "field" }, [el("div", { class: "label" }, "Title"), title]),
    el("div", { class: "field" }, [el("div", { class: "label" }, "Summary"), summary]),
    el("div", { class: "field" }, [el("div", { class: "label" }, "Tags"), tags, el("div", { class: "hint" }, "Separate with commas. A tag that names a project, person or topic belongs in a relation.")]),
    el("div", { class: "field" }, [el("div", { class: "label" }, "Body (markdown)"), body]),
  ]);
}

function saveBtnSync() { const b = document.querySelector("[data-testid=nv-save]"); if (b) b.disabled = !canSave(); }

function render() {
  card.setAttribute("data-status", S.status);
  card.replaceChildren();
  if (!S.draft) return;
  const d = S.draft, editing = S.mode === "edit" && S.status === "draft";
  const x = d.extra_fields || {};

  // Two groups, so that a narrow frame wraps the description and leaves the buttons together.
  const bar = el("div", { class: "bar" }, [
    el("div", { class: "info" }, [
      el("span", { class: "dot", style: "background:" + colorOf(d.type) }),
      el("span", { testid: "nv-type" }, d.type + (x.subtype ? " / " + x.subtype : "")),
      S.status === "saved" && S.saved ? el("span", {}, S.saved.uid) : el("span", { class: "badge draft", testid: "nv-badge" }, "draft — not saved"),
      S.status === "saved" ? el("span", { class: "badge saved" }, "saved") : null,
      el("span", {}, words(d.body) + " words"),
    ]),
    el("div", { class: "actions" }, [
      S.status === "draft" ? el("button", { class: "btn", testid: editing ? "nv-preview" : "nv-edit", onclick: () => { S.mode = editing ? "view" : "edit"; render(); } }, editing ? "Preview" : "Edit") : null,
      S.status === "draft" && edited() ? el("button", { class: "btn", testid: "nv-reset", onclick: () => { const o = S.original; load(o); } }, "Reset") : null,
      S.status === "draft" || S.status === "saving"
        ? el("button", { class: "btn primary", testid: "nv-save", disabled: !canSave(), onclick: save,
            title: S.errors.length ? "Fix the problems first" : needsChoice() ? "Choose what to do about the similar node first" : "" },
            S.status === "saving" ? "Saving…" : S.allowDup ? "Save anyway" : "Save")
        : null,
    ]),
  ]);

  const doc = el("div", { class: "doc" });
  if (editing) doc.append(form());
  else {
    doc.append(el("h1", { testid: "nv-title" }, d.title || "(untitled)"), pills());
    if (d.summary) doc.append(el("p", { class: "summary", testid: "nv-summary" }, d.summary));
  }
  const rels = relationsBlock(); if (rels) doc.append(rels);
  doc.append(el("div", { id: "banners" }));
  if (!editing) {
    const md = markdown(d.body);
    md.classList.add("md"); md.setAttribute("data-testid", "nv-body");
    if (!d.body || !d.body.trim()) md.append(el("p", { class: "empty" }, "(no body)"));
    doc.append(md);
  }
  card.append(bar, doc);
  drawBanners();
}

// The banners are their own region so they can change while a field has focus.
function drawBanners() {
  const host = document.getElementById("banners");
  if (host) host.replaceChildren(...banners());
  reportHeight();
}

// ---------- actions ----------
function payload() {
  const d = S.draft, a = { type: d.type, title: d.title.trim(), body: d.body || "" };
  const rels = (d.relations || []).filter((_, i) => !S.off.has(i));
  if ((d.tags || []).length) a.tags = d.tags;
  if ((d.domains || []).length) a.domains = d.domains;
  if ((d.summary || "").trim()) a.summary = d.summary.trim();
  if (d.author) a.author = d.author;
  if (rels.length) a.relations = rels;
  if ((d.references || []).length) a.references = d.references;
  if (Object.keys(d.extra_fields || {}).length) a.extra_fields = d.extra_fields;
  if (S.allowDup) a.allow_duplicate = true;
  return a;
}

// Tell the assistant, so it can do the wrap-up and surface what the tool returned. A host may
// refuse a message (it can ask the user first); the context update is the quieter fallback.
async function tellAssistant(text) {
  try { await request("ui/message", { role: "user", content: { type: "text", text } }); return true; }
  catch { try { await request("ui/update-model-context", { content: [{ type: "text", text }] }); return true; } catch { return false; } }
}

async function save() {
  if (!canSave()) return;
  S.status = "saving"; S.problem = null; render();
  try {
    const r = await callTool("write_vault", payload());
    if (r.duplicate) {                              // write_vault's own gate: nothing was written
      S.duplicate = r; S.allowDup = false; S.status = "draft";
    } else if (r.errors && r.errors.length) {
      S.errors = r.errors; S.status = "draft";
    } else if (r.error) {
      S.problem = r.error; S.status = "draft";
    } else if (r.uid) {
      S.saved = r; S.status = "saved"; S.mode = "view"; S.notified = null;
      render();
      S.notified = await tellAssistant(savedMessage(r));
      drawBanners();
      return;
    } else {
      S.problem = "The vault gave an unexpected answer; check whether the node was saved."; S.status = "draft";
    }
  } catch (err) {
    S.problem = String(err.message || err); S.status = "draft";
  }
  render();
}

function savedMessage(r) {
  const d = S.draft, o = S.original.draft;
  const lines = ["I clicked Save on the review card. Saved " + d.type + " \"" + d.title.trim() + "\" as " + r.uid + (r.path ? " (" + r.path + ")." : ".")];
  if (edited()) {
    const changed = [];
    if (o.title !== d.title) changed.push("title");
    if ((o.summary || "") !== (d.summary || "")) changed.push("summary");
    if (JSON.stringify(o.tags) !== JSON.stringify(d.tags)) changed.push("tags");
    if (o.body !== d.body) changed.push("body");
    if (S.off.size) changed.push("relations (" + S.off.size + " left out)");
    lines.push("I edited the draft before saving: " + changed.join(", ") + ". Use what is in the vault, not your original draft.");
  }
  for (const k of ["tag_warnings", "body_warnings", "relation_warnings", "has_asset_warnings"]) {
    if (r[k] && r[k].length) lines.push(k.replace(/_/g, " ") + ": " + r[k].join(" | "));
  }
  lines.push("Continue with the wrap-up.");
  return lines.join("\n");
}

async function handoffUpdate() {
  if (S.sending) return;
  const d = S.draft, dup = S.duplicate || {};
  const text = "Do not save a new node. Update the existing node " + (dup.name || "") + " (" + (dup.uid || "uid unknown") +
    ") with this draft instead, as I have it on the review card now:\n" +
    JSON.stringify({ title: d.title, summary: d.summary, tags: d.tags, body: d.body }, null, 1);
  S.sending = true; S.problem = null;
  const ok = await tellAssistant(text);          // claim the hand-off only once the host took it
  S.sending = false;
  if (ok) { S.handoffTo = dup.name || dup.uid; S.status = "handoff"; }
  else S.problem = "The assistant could not be messaged from here. Ask it in the chat to update " + (dup.name || "the existing node") + ".";
  render();
}

// ---------- sizing ----------
let lastHeight = 0;
function reportHeight() {
  // The body's own box, not documentElement.scrollHeight: that is never smaller than the frame,
  // so the frame could grow but never shrink back after a re-render.
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  if (h && h !== lastHeight) { lastHeight = h; send({ method: "ui/notifications/size-changed", params: { height: h } }); }
}
new ResizeObserver(reportHeight).observe(document.body);

window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && S.draft && canSave()) { e.preventDefault(); save(); }
});

// ---------- start ----------
request("ui/initialize", {
  appInfo: { name: "loci-node-view", version: "0.1.0" },
  appCapabilities: {},
  protocolVersion: "2026-01-26",
}).then(() => send({ method: "ui/notifications/initialized" }))
  .catch((err) => { document.getElementById("waiting").textContent = "Could not reach the host: " + err.message; });
</script>
</body>
</html>
