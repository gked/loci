# Loci Ontology
# ontology_version: 2
#
# Machine-readable type system. Loaded into TypeRegistry at server startup.
# This file is reseeded on META_VERSION bumps — do not edit in your vault.
# To define custom types: create ontology-user.yaml in your vault/meta/ folder.
#
# Safety rules for ontology-user.yaml:
#   - extends must name a canonical type (one level only — no extending user types)
#   - name must not collide with any canonical type
#   - additive only: add fields, add enum values — never redefine inherited ones

base_fields:
  required:
    - uid
    - type
    - title
    - author
    - state
    - created_at
    - updated_at
    - archived_at
    - tags
    - domains
    - summary
    - relations
    - references
  optional:
    - language
    - aliases
    - has_asset

types:
  - name: document
    extends: null
    description: >
      Written content without external provenance. No source URL required.
      subtype says what kind of document it is; who it was with and which
      sphere it belongs to are carried by relations and domains, never by
      the subtype.
    fields:
      required:
        - name: status
          type: enum
          values: [draft, evergreen, archived]
        - name: subtype
          type: enum
          values: [meeting-notes, report, spec, plan, transcript, essay, journal, note]
      optional: []

  - name: article
    extends: null
    description: >
      External content with provenance: blog posts, books, papers, news.
      subtype is the medium of the content.
    fields:
      required:
        - name: source_url
          type: string
        - name: subtype
          type: enum
          values: [article, blog-post, news, book, paper, scholarly, technical, video]
      optional:
        - name: author
          type: string
        - name: published_at
          type: datetime
        - name: highlights
          type: array

  - name: bookmark
    extends: null
    description: Saved URL with minimal metadata. Use article when capturing full content.
    fields:
      required:
        - name: source_url
          type: string
      optional:
        - name: site_name
          type: string

  - name: conversation
    extends: null
    description: Saved LLM or human conversation.
    fields:
      required:
        - name: participants
          type: array
        - name: platform
          type: enum
          values: [claude, chatgpt, human, other]
      optional:
        - name: model
          type: string
        - name: turns
          type: string

  - name: project
    extends: null
    description: Ongoing work with goals and milestones.
    fields:
      required:
        - name: status
          type: enum
          values: [active, paused, completed, abandoned]
      optional:
        - name: goals
          type: array
        - name: milestones
          type: array
        - name: due_date
          type: datetime

  - name: task
    extends: null
    description: >
      Discrete actionable item with due date and status. subtype says what
      kind of work it is: something broken (bug), something to build
      (feature), something to decide or find out (question), or admin
      (chore).
    fields:
      required:
        - name: status
          type: enum
          values: [todo, in-progress, done, cancelled, duplicate]
        - name: subtype
          type: enum
          values: [bug, feature, question, chore]
      optional:
        - name: due_date
          type: datetime
        - name: priority
          type: enum
          values: [high, medium, low]
        - name: assignee
          type: string

  - name: event
    extends: null
    description: Point-in-time or period occurrence.
    fields:
      required:
        - name: start_at
          type: datetime
      optional:
        - name: end_at
          type: datetime
        - name: location
          type: string
        - name: participants
          type: array

  - name: entity
    extends: null
    description: >
      Real-world actor: person, organization, or place.
      subtype changes which optional fields make sense.
    fields:
      required:
        - name: subtype
          type: enum
          values: [person, organization, place]
      optional:
        - name: roles
          type: array
        - name: organization
          type: string
        - name: location
          type: string
        - name: website
          type: string
        - name: industry
          type: string
        - name: founded_at
          type: datetime
        - name: affiliations
          type: array
        - name: history
          type: array

  - name: procedure
    extends: null
    description: >
      Repeatable process with ordered steps and expected outcome.
      Use tags for category: recipe, workout, protocol, playbook, tutorial.
    fields:
      required:
        - name: steps
          type: array
      optional:
        - name: expected_outcome
          type: string
        - name: inputs
          type: array
        - name: duration_minutes
          type: string

  - name: skill
    extends: procedure
    description: >
      A reusable agent skill — a packaged, repeatable workflow with a triggering
      description and optional bundled scripts or reference files (for example a
      Claude SKILL.md package). Inherits the procedure step model: steps capture
      the workflow, inputs the expected input artifact, expected_outcome the
      deliverable.
    fields:
      optional:
        - name: triggers
          type: array
        - name: bundled_resources
          type: array
        - name: skill_version
          type: string

  - name: topic
    extends: null
    description: Organizing hub for a subject area.
    fields:
      required:
        - name: status
          type: enum
          values: [active, archived]
      optional:
        - name: parent_topic
          type: string

  - name: asset
    extends: null
    description: >
      A thing you own or possess — a digital file stored in the asset vault,
      a physical object, or both. subtype categorises the kind of asset;
      storage summarises whether it is digital, physical, or both.
      File locations live in the has_asset frontmatter list on the vault node
      (scheme: local for adopted files, other schemes for referenced locations).
    fields:
      required:
        - name: subtype
          type: enum
          values: [book, video, music, podcast, presentation, visual, physical]
      optional:
        - name: storage
          type: enum
          values: [digital, physical, both]
        - name: acquired_at
          type: datetime
        - name: highlights
          type: array
    subtypes:
      - name: book
        fields:
          optional:
            - name: genre
              type: enum
              values: [philosophy-psychology, body-mind-spirit, religion, fiction-literature, science-fiction, history, social-sciences, natural-sciences-mathematics, technology-computing, business-economics, health, homesteading-practical-skills, biography-autobiography]
        body_template: |
          ## Bibliographic
          - Published:
          - Original language:
          - Edition:

          ## About
          <!-- What this book is about. For Russian books: one paragraph in English,
               one paragraph in Russian. -->

          ## Notes
          <!-- Personal notes, connections to other books. Filled in over time. -->

  - name: log
    extends: null
    description: >
      A personal record of engaging with something over time — reading a book,
      running an experiment, taking a course, a practice session. One log per
      engagement. subject_uid links to the vault node being engaged with.
      Use tags to categorize: reading, experiment, course, workout, etc.
    fields:
      required:
        - name: subject_uid
          type: string
        - name: log_status
          type: enum
          values: [in-progress, finished, abandoned]
      optional:
        - name: started_at
          type: datetime
        - name: finished_at
          type: datetime
        - name: rating
          type: string
        - name: highlights
          type: array

