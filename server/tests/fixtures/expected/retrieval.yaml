# ---------------------------------------------------------------------------
# find_nodes — by due_date
# ---------------------------------------------------------------------------

- id: find_nodes_due_before_2026_02
  method: find_nodes
  args: {due_before: "2026-02-01"}
  expected_uids: [due00001]
  mode: exact

# ---------------------------------------------------------------------------
# query_path — ordered shortest path
# ---------------------------------------------------------------------------

- id: query_path_chain_a_to_c
  method: query_path
  args: {uid_from: "chain001", uid_to: "chain003"}
  expected_path_uids: ["chain001", "chain002", "chain003"]

# ---------------------------------------------------------------------------
# query_related — ego graph neighbors
# ---------------------------------------------------------------------------

- id: query_related_hub_spokes_depth1
  method: query_related
  args: {uid: "hub00001", depth: 1}
  expected_uids: [spoke001, spoke002, spoke003]
  mode: exact

- id: query_related_chain_depth2
  method: query_related
  args: {uid: "chain001", depth: 2}
  expected_uids: [chain002, chain003]
  mode: contains

# ---------------------------------------------------------------------------
# search_vault — title and summary substring match
# ---------------------------------------------------------------------------

- id: search_vault_distributed
  method: search_vault
  args: {query: "distributed"}
  expected_uids: [srch0001]
  mode: contains

- id: search_vault_graph_database
  method: search_vault
  args: {query: "graph database"}
  expected_uids: [srch0003]
  mode: contains
