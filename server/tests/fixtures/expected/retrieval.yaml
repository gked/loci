# tests/fixtures/expected/retrieval.yaml
# Expected results for test_retrieval.py parametrized cases.
#
# mode: exact   — result set must equal expected_uids exactly
# mode: contains — expected_uids must be a subset of the result set
# (no mode)     — used for path tests; check expected_path_uids ordering

# ---------------------------------------------------------------------------
# find_nodes — by type
# ---------------------------------------------------------------------------

- id: find_nodes_by_type_task
  method: find_nodes
  args: {type: task}
  expected_uids: [aaa00001, aaa00002, aaa00003, aaa00004, due00001]
  mode: exact

- id: find_nodes_by_type_article
  method: find_nodes
  args: {type: article}
  expected_uids: [ccc00001, ccc00002, srch0001]
  mode: exact

# ---------------------------------------------------------------------------
# find_nodes — by tag
# ---------------------------------------------------------------------------

- id: find_nodes_by_tag_python
  method: find_nodes
  args: {tag: python}
  expected_uids: [aaa00001, aaa00003, aaa00004, bbb00001, ccc00001, eee00001, lang0001]
  mode: exact

- id: find_nodes_by_tag_testing
  method: find_nodes
  args: {tag: testing}
  expected_uids: [aaa00001, aaa00002, aaa00004, bbb00002, eee00002]
  mode: exact

# ---------------------------------------------------------------------------
# find_nodes — by status
# ---------------------------------------------------------------------------

- id: find_nodes_by_status_todo
  method: find_nodes
  args: {status: todo}
  expected_uids: [aaa00001, aaa00002, aaa00003, due00001]
