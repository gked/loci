- id: find_nodes_by_status_done
  method: find_nodes
  args: {status: done}
  expected_uids: [aaa00004]
  mode: exact

# ---------------------------------------------------------------------------
# find_nodes — by language
# ---------------------------------------------------------------------------

- id: find_nodes_by_language_es
  method: find_nodes
  args: {language: es}
  expected_uids: [lang0001]
