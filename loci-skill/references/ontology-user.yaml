# Loci User Ontology
# Define custom types that extend canonical ones.
# This file is yours — it is seeded once and never overwritten by the system.
#
# Rules:
#   - extends must name a canonical type (one level only)
#   - name must not collide with any canonical type
#   - additive only: you may add fields and enum values,
#     but cannot redefine or remove inherited ones
#
# Example:
#   types:
#     - name: recipe
#       extends: procedure
#       description: A cooking or food preparation procedure.
#       fields:
#         optional:
#           - name: servings
#             type: string
#           - name: cuisine
#             type: string

types:
  - name: reading-log
    extends: document
    description: >
      A record of one reading of a book or long-form content — notes, highlights,
      and reflections. Create one per reading so multiple reads of the same work
      are tracked separately. Link to the source asset via is-based-on relation.
    fields:
      required:
        - name: read_status
          type: enum
          values: [in-progress, finished, abandoned]
      optional:
        - name: source_url
          type: string
        - name: started_at
          type: datetime
        - name: finished_at
          type: datetime
        - name: rating
          type: string
        - name: highlights
          type: array
