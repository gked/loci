[project]
name = "loci"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "networkx>=3.0",
    "uvicorn>=0.29",
    "fastapi>=0.111",
    "pypdf>=4.0",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
pythonpath = [".", "server"]
testpaths = ["server/tests"]
markers = [
    "e2e: browser end-to-end test — needs a Playwright browser and spawns servers",
    "fixture_bound: asserts on e2e fixture vault data — cannot pass against a deployment",
]
