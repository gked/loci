[project]
name = "loci"
version = "0.6.0"
# Source-available, not open source: noncommercial use is free, commercial use
# needs a separate licence. See LICENSE and CONTRIBUTING.md.
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    # Upper bound is load-bearing, not caution: mcp 2.x renamed FastMCP to
    # MCPServer, and mcp_server.py imports mcp.server.fastmcp. uv.lock keeps a
    # checkout on 1.x, so only a fresh install from the wheel — the exact case
    # of setting Loci up on another machine — resolves 2.x and dies at import.
    # test_mcp_is_pinned_below_2 fails if this bound is dropped while the code
    # still imports FastMCP.
    "mcp[cli]>=1.0,<2",
    "httpx>=0.27",
    "networkx>=3.0",
    "uvicorn>=0.29",
    "fastapi>=0.111",
    "pypdf>=4.0",
    "defusedxml>=0.7",
    # Pure-Python Git, so vault history needs no `git` on the machine.
    "dulwich>=1.2.20",
]

# Two processes, not one — see the module docstring in src/loci/__init__.py.
[project.scripts]
loci-mcp = "loci.mcp_server:main"
loci = "loci.http_server:main"

# The built frontend. It is a build product, so it is gitignored — and
# hatchling honours .gitignore, which would drop it silently. Declaring it as
# an artifact is what overrides that, and it has to sit here rather than under
# the wheel target: `uv build` builds the sdist first and the wheel from it, so
# a file missing from the sdist never reaches the wheel either.
#
# `make wheel` is what puts the bundle there. A bare `uv build` produces a
# backend-only wheel, and http_server says so rather than serving a blank page.
[tool.hatch.build]
artifacts = ["src/loci/static/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Everything under src/loci ships, not just the .py files. That is load-bearing:
# the registries read their canonical YAML out of skills/references/ at runtime,
# and vault_init.py seeds the same files into a new vault — an installed Loci
# cannot start a vault without them. test_ontology_guide_ships_inside_the_package
# guards a seed source drifting back out of the package.
[tool.hatch.build.targets.wheel]
packages = ["src/loci"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: browser end-to-end test — needs a Playwright browser and spawns servers",
    "fixture_bound: asserts on e2e fixture vault data — cannot pass against a deployment",
]
