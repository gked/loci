name: Release

# Fires on the tag `make release-publish` pushes. Everything before this — the
# version bump, its PR, the merge — has already happened on main, and both
# suites ran there. What is left is to prove the tag is honest, build the
# artifact, and publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release_notes.py reads the previous tag's files out of git history,
          # so a shallow clone would leave every release looking like the first.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # The wheel carries the built frontend, so the release needs Node. An
      # installed Loci has neither app/ nor a toolchain to build it with, and
      # `loci` would serve an API and no UI.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # First, and before anything is built: a tag whose version disagrees with
      # pyproject.toml would publish a wheel that lies about what it is. That
      # happens when the tag is pushed before the bump PR merged.
      - name: Verify the tag matches pyproject.toml
        run: uv run python scripts/release.py check "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: uv sync --extra dev

      # The unit suite only. The e2e suite already ran on the merge commit this
      # tag points at, and re-running the browser against an unchanged tree
      # would add minutes without adding a signal.
      - name: Run unit tests
        run: uv run pytest tests/ -v -m "not e2e"

      # `make wheel`, not `uv build`: it compiles the frontend into
      # src/loci/static/ first. A bare uv build produces a backend-only wheel,
      # which is what every release before this shipped.
      - name: Build the wheel
        run: make wheel

      # PyPI refuses a distribution whose metadata it cannot render, and a
      # published version can never be replaced. Catch it here, before the
      # GitHub Release exists and long before the upload. twine is pinned: this
      # job builds what is uploaded to PyPI, so it does not run a floating tool.
      - name: Check the distribution metadata
        run: uvx twine@7.0.0 check --strict dist/*

      # The publish job ships exactly these files, not a second build.
      - name: Keep the built distributions for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # PyPI trusted publishing: no API token is stored anywhere. PyPI trusts this
  # repository, this workflow file and this environment, and accepts the
  # short-lived identity token GitHub mints for the job. That is also why this
  # is its own job — `id-token: write` is held by the one job that runs no
  # repository code, only the upload.
  #
  # It runs before the GitHub Release. If the pending publisher or the `pypi`
  # environment is missing or misnamed, the upload fails here and no Release
  # exists yet: fix the setup and "Re-run failed jobs". The reverse order left a
  # public Release for a version that never reached PyPI.
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/loci-vault
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Last, and only once PyPI has the files: a Release means the version is out.
  # If this job fails, "Re-run failed jobs" repeats only this job. PyPI refuses
  # a second upload of the same version, so the upload must not be repeated.
  release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating a Release writes to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          # release_notes.py reads the previous tag's files out of git history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # "^" is the tag's parent: the newest release tag before this one.
          # Empty before the first release, which release_notes.py handles.
          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          echo "Previous release: ${PREVIOUS:-none}"

          # The upgrade section first — it is the part that asks something of
          # the reader — then GitHub's own list of merged PRs beneath it.
          uv run --no-project python scripts/release_notes.py "${PREVIOUS}" "${TAG}" > notes.md
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            ${PREVIOUS:+-f previous_tag_name="${PREVIOUS}"} \
            --jq .body >> notes.md

          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Loci ${GITHUB_REF_NAME}" \
            --notes-file notes.md
