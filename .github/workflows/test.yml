name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest server/tests/ -v -m "not e2e"

  e2e:
    name: Browser e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Install frontend dependencies
        run: npm ci --prefix app

      # --with-deps pulls the system libraries headless Chromium needs on
      # ubuntu-latest; without it the browser fails to launch.
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run e2e tests
        run: uv run pytest server/tests/e2e/ -v --tracing=retain-on-failure

      # Traces replay a CI failure locally: npx playwright show-trace <file>
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
