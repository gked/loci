<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Loci — Vault</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--vault-bg);color:var(--vault-fg);font-family:var(--font-sans)}
  #app{display:flex;height:100vh;overflow:hidden}
  .topbar{height:46px;border-bottom:1px solid var(--vault-rule);display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;flex-shrink:0}
  .brand{display:flex;align-items:center;gap:8px}
  .brand-name{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--vault-fg)}
  .brand-version{font-family:var(--font-mono);font-size:9px;color:var(--vault-fg-faint);padding:1px 5px;background:var(--vault-sunken);border-radius:2px;margin-left:2px}
  .crumb{font-family:var(--font-mono);font-size:11px;color:var(--vault-fg-muted);white-space:nowrap}
  .topsearch{margin-left:auto;display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--vault-bg);border:1px solid var(--vault-rule);border-radius:6px;font-family:var(--font-mono);font-size:11px;color:var(--vault-fg-muted);cursor:pointer;white-space:nowrap;flex-shrink:0;width:240px}
  .topsearch:hover{background:var(--vault-sunken)}
  .kbd{margin-left:auto;background:#fff;border:1px solid var(--vault-rule);padding:1px 5px;border-radius:3px;font-size:10px}
  .new-btn{padding:5px 12px;font-family:var(--font-sans);font-size:12px;background:var(--vault-fg);color:#fff;border:0;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .graph-btn{padding:5px 10px;font-family:var(--font-sans);font-size:12px;background:#fff;color:var(--vault-fg);border:1px solid var(--vault-rule);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .graph-btn:hover{background:var(--vault-sunken);border-color:var(--vault-fg-muted)}
  .graph-btn .kbd{background:var(--vault-sunken);border:1px solid var(--vault-rule);padding:0px 4px;border-radius:2px;font-family:var(--font-mono);font-size:9px;color:var(--vault-fg-muted)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="vault-data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="editor.jsx"></script>
<script type="text/babel" src="right-rail.jsx"></script>
<script type="text/babel" src="graph-view.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const App = () => {
  const [section, setSection] = useState("all");
  const [selectedUid, setSelectedUid] = useState("a1b2c3d4");
  const [cmdOpen, setCmdOpen] = useState(false);
  const [graphOpen, setGraphOpen] = useState(false);
  const [vault, setVault] = useState(VAULT);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); setCmdOpen(true); }
      if (e.key === "g" && !e.metaKey && !e.ctrlKey && e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
        e.preventDefault(); setGraphOpen(o => !o);
      }
      if (e.key === "Escape") { setCmdOpen(false); setGraphOpen(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const selected = vault.find(n => n.uid === selectedUid);
  const sectionLabel = section === "all" ? "All loci"
    : section === "recent" ? "Recent"
    : section.startsWith("t:") ? section.slice(2)
    : section;

  const updateNode = (next) => setVault(prev => prev.map(n => n.uid === next.uid ? next : n));

  return (
    <div className="inner-shell" style={{ display: "flex", flexDirection: "column", flex: 1, width: "100%", minHeight: 0, minWidth: 0 }}>
      {/* topbar */}
      <div className="topbar">
        <div className="brand">
          <img src="../../assets/logo/monogram.svg" width="20" height="20" alt=""/>
          <span className="brand-name">Loci</span>
          <span className="brand-version">v0.4</span>
        </div>
        <span className="crumb">vault &middot; {sectionLabel}{selected && <> &middot; <span style={{color:"var(--vault-fg)"}}>{selected.uid}</span></>}</span>
        <div className="topsearch" onClick={() => setCmdOpen(true)}>
          <Icon name="search" size={12}/><span>Search vault</span><span className="kbd">⌘K</span>
        </div>
        <button className="graph-btn" onClick={() => setGraphOpen(true)} title="Open topology — G">
          <Icon name="graph" size={13}/> Topology <span className="kbd">G</span>
        </button>
        <button className="new-btn" onClick={() => alert("(stub) capture")}>
          <Icon name="plus" size={12}/> capture
        </button>
      </div>

      {/* body — editor left, rail right */}
      <div style={{ flex: 1, display: "flex", minHeight: 0, minWidth: 0 }}>
        <Editor node={selected} onChange={updateNode} onCmd={(c) => { if (c === "close") setSelectedUid(null); if (c === "graph") setGraphOpen(true); }}/>
        <RightRail
          section={section}
          onNav={setSection}
          vault={vault}
          selectedUid={selectedUid}
          onOpenUid={setSelectedUid}
          onOpenGraph={() => setGraphOpen(true)}
        />
      </div>

      {/* graph overlay */}
      {graphOpen && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(20,18,12,0.4)", zIndex: 200, display: "flex", padding: "32px" }}>
          <div style={{ flex: 1, background: "#fff", border: "1px solid var(--vault-rule)", borderRadius: 8, boxShadow: "var(--shadow-overlay)", display: "flex", overflow: "hidden", position: "relative" }}>
            <button onClick={() => setGraphOpen(false)} style={{ position: "absolute", top: 12, right: 12, zIndex: 5, padding: "5px 10px", fontFamily: "var(--font-mono)", fontSize: 11, background: "rgba(255,255,255,0.95)", border: "1px solid var(--vault-rule)", borderRadius: 4, cursor: "pointer" }}>esc · close</button>
            <GraphView vault={vault} onOpen={(uid) => { setSelectedUid(uid); setGraphOpen(false); }}/>
          </div>
        </div>
      )}

      <CommandBar open={cmdOpen} onClose={() => setCmdOpen(false)} vault={vault} onOpen={setSelectedUid}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
