<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Loci — Outer Shell</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html,body{margin:0;background:var(--ivory);min-height:100vh}
  body{background-image:var(--noise-paper);background-repeat:repeat}
  .outer-shell{min-height:100vh;padding:64px 0;display:flex;flex-direction:column;align-items:center}
  .stage{width:960px;max-width:calc(100% - 64px)}
  .plate{border:1px solid var(--travertine);padding:6px;background:var(--ivory)}
  .plate-inner{border:1px solid var(--travertine);padding:64px 80px;display:flex;flex-direction:column;align-items:center;gap:24px}
  .columns{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:48px}
  .nav{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 8px;margin-bottom:24px}
  .navlinks{display:flex;gap:24px}
  .navlinks a{color:var(--ink);text-decoration:none;font-size:14px}
  .navlinks a:hover{color:var(--terracotta)}
  .latin{font-family:var(--font-display);font-style:italic;color:var(--bronze);font-size:14px;letter-spacing:0.02em}
  .toc{display:flex;flex-direction:column;gap:8px}
  .toc-row{display:flex;align-items:baseline;gap:10px;font-family:var(--font-serif);font-size:15px}
  .toc-row .num{font-family:var(--font-display);font-style:italic;color:var(--terracotta);min-width:32px}
  .toc-row .lead{flex:1;border-bottom:1px dotted var(--travertine);height:1px;align-self:end;margin-bottom:6px}
  .toc-row .pg{font-family:var(--font-mono);font-size:11px;color:var(--bronze)}
  .quote{font-family:var(--font-display);font-style:italic;font-size:22px;line-height:1.5;color:var(--ink);text-align:center;max-width:720px}
  .quote::before{content:"« ";color:var(--terracotta)}
  .quote::after{content:" »";color:var(--terracotta)}
  .citation{font-family:var(--font-serif);font-feature-settings:"smcp" 1,"c2sc" 1;text-transform:lowercase;letter-spacing:0.18em;font-size:11px;color:var(--bronze)}
</style>
</head>
<body>
<div class="outer-shell">
<div class="stage">

  <div class="nav">
    <div id="brand"></div>
    <div class="navlinks">
      <a href="#">about</a>
      <a href="#">install</a>
      <a href="#">docs</a>
      <a href="https://github.com/gked/loci">github</a>
    </div>
  </div>

  <div id="splash"></div>

  <div class="columns">
    <div id="toc"></div>
    <div id="quote"></div>
  </div>

</div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel">
const App = () => null;

ReactDOM.createRoot(document.getElementById('brand')).render(<Wordmark size={36}/>);

const Splash = () => (
  <Plate>
    <SmallCaps>— memoria · locorvm · vid·cf·qv —</SmallCaps>
    <h1 style={{fontFamily:"var(--font-display)",fontWeight:500,fontSize:84,lineHeight:1.05,letterSpacing:"-0.015em",color:"var(--lampblack)",margin:0,textAlign:"center"}}>
      A place for everything<br/>you have ever thought.
    </h1>
    <MeanderRule width="280px"/>
    <p style={{fontFamily:"var(--font-display)",fontStyle:"italic",fontSize:22,lineHeight:1.45,color:"var(--ink)",margin:0,maxWidth:680,textAlign:"center"}}>
      Loci is a personal knowledge vault — plain Markdown files, organised as a traversable graph of fixed locations. Navigated by you, and by your agents.
    </p>
    <div style={{display:"flex",gap:16,marginTop:8}}>
      <OButton variant="primary">Install Loci</OButton>
      <OButton variant="secondary">Read the manual</OButton>
    </div>
    <div style={{marginTop:8}}><Seal size={96}/></div>
  </Plate>
);

ReactDOM.createRoot(document.getElementById('splash')).render(<Splash/>);

const Toc = () => (
  <div>
    <SectionHeader numeral="I" overline="contents" title="Table of loci"/>
    <div className="toc">
      {[
        ["i.","On the method of loci","p. 003"],
        ["ii.","Capture · save anything","p. 011"],
        ["iii.","The vault as a graph","p. 024"],
        ["iv.","Traverse · query · synthesize","p. 037"],
        ["v.","Agents at the gate","p. 052"],
        ["vi.","On versioning & decay","p. 068"],
      ].map(([n,t,p],i)=>(
        <div className="toc-row" key={i}>
          <span className="num">{n}</span><span>{t}</span><span className="lead"></span><span className="pg">{p}</span>
        </div>
      ))}
    </div>
  </div>
);

const Quote = () => (
  <div>
    <SectionHeader numeral="II" overline="locus classicus" title="Cicero, on memory"/>
    <p className="quote">It is by placing things in fixed locations, and by walking the rooms of a familiar house, that the mind preserves what it would otherwise lose.</p>
    <div style={{textAlign:"center",marginTop:16}}><span className="citation">— de oratore · ii · 86 (paraphr.)</span></div>
  </div>
);

ReactDOM.createRoot(document.getElementById('toc')).render(<Toc/>);
ReactDOM.createRoot(document.getElementById('quote')).render(<Quote/>);
</script>
</body>
</html>
