<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--ivory);overflow:hidden}
.card{width:700px;height:150px;display:flex;align-items:center;justify-content:center;gap:24px;padding:0 36px;box-sizing:border-box;font-family:var(--font-display);position:relative}
.card::before,.card::after{content:"";position:absolute;left:36px;right:36px;height:1px;background:var(--travertine)}
.card::before{top:18px}.card::after{bottom:18px;border-bottom:1px solid var(--travertine);height:3px;border-top:1px solid var(--travertine)}
.wm{font-family:var(--font-display);font-weight:500;font-size:96px;line-height:1;color:var(--lampblack);letter-spacing:-0.01em}
.dot{display:inline-block;width:6px;height:6px;background:var(--terracotta);border-radius:50%;vertical-align:18px;margin:0 1px}
.tag{font-feature-settings:"smcp" 1,"c2sc" 1;text-transform:lowercase;letter-spacing:0.18em;font-size:11px;color:var(--bronze);font-family:var(--font-serif);position:absolute;top:24px;left:50%;transform:translateX(-50%)}
.tag2{font-style:italic;font-family:var(--font-display);font-size:13px;color:var(--bronze);position:absolute;bottom:24px;left:50%;transform:translateX(-50%)}
</style></head><body><div class="card outer-shell">
<span class="tag">memoria · locorvm</span>
<div class="wm">L<span class="dot"></span>oci</div>
<span class="tag2">— vid. cf. q.v. —</span>
</div></body></html>
