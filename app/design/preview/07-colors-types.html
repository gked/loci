<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--vault-bg);overflow:hidden}
.wrap{width:700px;padding:20px 28px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;font-family:var(--font-sans);color:var(--vault-fg)}
.row{display:flex;align-items:center;gap:10px;font-size:13px}
.row .hex{font-family:var(--font-mono);font-size:10px;color:var(--vault-fg-muted);margin-left:auto}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,0.06)}
</style></head><body><div class="wrap inner-shell">
<div class="row"><span class="dot" style="background:#2f6fc4"></span>project<span class="hex">2f6fc4</span></div>
<div class="row"><span class="dot" style="background:#ff8a00"></span>task<span class="hex">ff8a00</span></div>
<div class="row"><span class="dot" style="background:#1fa050"></span>document<span class="hex">1fa050</span></div>
<div class="row"><span class="dot" style="background:#e63946"></span>entity<span class="hex">e63946</span></div>
<div class="row"><span class="dot" style="background:#2dbfb6"></span>conversation<span class="hex">2dbfb6</span></div>
<div class="row"><span class="dot" style="background:#f4c430"></span>article<span class="hex">f4c430</span></div>
<div class="row"><span class="dot" style="background:#c062b8"></span>bookmark<span class="hex">c062b8</span></div>
<div class="row"><span class="dot" style="background:#ff6b8a"></span>procedure<span class="hex">ff6b8a</span></div>
<div class="row"><span class="dot" style="background:#a4421f"></span>topic<span class="hex">a4421f</span></div>
<div class="row"><span class="dot" style="background:#7a5cc1"></span>event<span class="hex">7a5cc1</span></div>
<div class="row"><span class="dot" style="background:#5e7a8c"></span>asset<span class="hex">5e7a8c</span></div>
<div class="row"><span class="dot" style="background:#bab0ac"></span>default<span class="hex">bab0ac</span></div>
</div></body></html>
