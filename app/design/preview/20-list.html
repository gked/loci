<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--vault-bg);overflow:hidden}
.wrap{width:700px;padding:18px 28px;box-sizing:border-box;font-family:var(--font-sans);color:var(--vault-fg)}
.row{display:flex;align-items:center;gap:14px;padding:7px 8px;border-bottom:1px dashed var(--vault-rule)}
.row:hover,.row.sel{background:var(--vault-sunken)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.t{font-size:13px;flex:1}
.uid{font-family:var(--font-mono);font-size:10px;color:var(--vault-fg-faint);width:74px;text-align:right}
.tag{font-weight:600;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--vault-fg-muted);margin-bottom:6px;display:block}
.lead{flex:1;border-bottom:1px dotted var(--vault-rule);margin:0 6px;height:1px;align-self:end;margin-bottom:6px}
</style></head><body><div class="wrap inner-shell">
<span class="tag">vault list — leader-dot rows</span>
<div class="row sel"><span class="dot" style="background:#2f6fc4"></span><span class="t">loci</span><span class="lead"></span><span class="uid">a1b2c3d4</span></div>
<div class="row"><span class="dot" style="background:#1fa050"></span><span class="t">Asset registry — design spec</span><span class="lead"></span><span class="uid">e9f7d201</span></div>
<div class="row"><span class="dot" style="background:#ff8a00"></span><span class="t">Add networkx to pyproject.toml</span><span class="lead"></span><span class="uid">7a3b09cc</span></div>
<div class="row"><span class="dot" style="background:#a4421f"></span><span class="t">Graph databases</span><span class="lead"></span><span class="uid">12fe44a0</span></div>
<div class="row"><span class="dot" style="background:#f4c430"></span><span class="t">Attention is all you need</span><span class="lead"></span><span class="uid">b6c80fde</span></div>
</div></body></html>
