<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--ivory);overflow:hidden}
.wrap{width:700px;padding:24px 28px;box-sizing:border-box;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.s{aspect-ratio:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--ivory);font-family:var(--font-mono);font-size:10px}
.s.ink{color:var(--ivory)}
.s.dark{color:var(--lampblack)}
.name{font-family:var(--font-serif);font-style:italic;font-size:13px;line-height:1.2}
.hex{opacity:0.85;margin-top:2px}
</style></head><body><div class="wrap outer-shell">
<div class="s ink" style="background:#1a1612"><span class="name">ink</span><span class="hex">#1a1612</span></div>
<div class="s ink" style="background:#0d0a08"><span class="name">lampblack</span><span class="hex">#0d0a08</span></div>
<div class="s dark" style="background:#f5efe2"><span class="name">ivory</span><span class="hex">#f5efe2</span></div>
<div class="s dark" style="background:#ebe2cf"><span class="name">vellum</span><span class="hex">#ebe2cf</span></div>
<div class="s dark" style="background:#d8cdb4"><span class="name">travertine</span><span class="hex">#d8cdb4</span></div>
<div class="s ink" style="background:#a4421f"><span class="name">terracotta</span><span class="hex">#a4421f</span></div>
<div class="s ink" style="background:#1f3a68"><span class="name">lapis</span><span class="hex">#1f3a68</span></div>
<div class="s ink" style="background:#7a5a2e"><span class="name">bronze</span><span class="hex">#7a5a2e</span></div>
<div class="s ink" style="background:#3d6b5e"><span class="name">patina</span><span class="hex">#3d6b5e</span></div>
<div class="s dark" style="background:transparent;border:1px dashed var(--travertine);color:var(--bronze);align-items:center;justify-content:center;text-align:center"><span class="name">outer<br>shell</span></div>
</div></body></html>
