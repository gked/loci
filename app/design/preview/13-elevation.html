<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--vault-bg);overflow:hidden}
.wrap{width:700px;padding:24px 28px;box-sizing:border-box;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;font-family:var(--font-sans);color:var(--vault-fg)}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.b{width:160px;height:80px;background:var(--vault-surface);border-radius:6px}
.b1{border:1px solid var(--vault-rule)}
.b2{box-shadow:var(--shadow-card)}
.b3{box-shadow:var(--shadow-overlay)}
.lbl{font-size:11px;font-weight:600}
.sub{font-family:var(--font-mono);font-size:10px;color:var(--vault-fg-muted);text-align:center}
.tag{font-family:var(--font-sans);font-weight:600;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--vault-fg-muted);grid-column:1/-1}
</style></head><body><div class="wrap inner-shell">
<span class="tag">elevation · inner shell only — outer shell is flat</span>
<div class="cell"><div class="b b1"></div><span class="lbl">flat</span><span class="sub">1px hairline</span></div>
<div class="cell"><div class="b b2"></div><span class="lbl">card</span><span class="sub">subtle, low</span></div>
<div class="cell"><div class="b b3"></div><span class="lbl">overlay</span><span class="sub">⌘K, popovers</span></div>
</div></body></html>
