<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../instrument-shell.css"/>
<style>html,body{margin:0;padding:0;background:#060914;overflow:hidden}
.wrap{width:700px;height:380px;position:relative;font-family:var(--font-sans)}
</style></head>
<body class="instrument-shell">
<div class="wrap">
  <div class="canvas">
    <div class="meridian"></div>
    <div class="reticle"><i></i></div>
    <div class="corner tl"><i>kit · atom</i><b>reticle + meridian</b></div>
    <div class="corner tr" style="text-align:right"><i>focus</i><b>chartæ centrum</b></div>
    <div class="corner bl"><i>lat</i><b>40.71</b></div>
    <div class="corner br" style="text-align:right"><i>long</i><b>-74.00</b></div>

    <div style="position:absolute;inset:0;display:grid;place-items:center">
      <div style="text-align:center;max-width:440px">
        <div class="smcaps" style="margin-bottom:14px">— viewfinder · meridian —</div>
        <h2 style="font-family:var(--font-display);font-weight:500;font-size:32px;margin:0 0 12px;color:var(--t-fg);letter-spacing:-0.005em">
          Bracket the focus,<br/><em style="color:var(--t-bronze);font-style:italic">draw the meridians.</em>
        </h2>
        <p style="font-family:var(--font-serif);font-style:italic;font-size:14px;line-height:1.55;color:var(--t-fg-mute);margin:0">
          Reticle corners and dotted crosshairs frame any canvas — list, graph, plate.
          Same chrome on the paper variant for reading.
        </p>
      </div>
    </div>
  </div>
</div>
</body></html>
