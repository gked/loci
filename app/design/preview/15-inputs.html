<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--vault-bg);overflow:hidden}
.wrap{width:700px;padding:20px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;font-family:var(--font-sans)}
.tag{font-weight:600;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--vault-fg-muted)}
input,textarea{font-family:var(--font-sans);font-size:13px;background:#fff;border:1px solid var(--vault-rule);border-radius:6px;padding:8px 12px;color:var(--vault-fg);outline:none;width:100%;box-sizing:border-box}
input:focus{border-color:#1f3a68;box-shadow:0 0 0 3px rgba(31,58,104,0.12)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--vault-rule);border-radius:6px;padding:8px 12px;font-family:var(--font-mono);color:var(--vault-fg-muted);font-size:12px}
.search svg{width:14px;height:14px;color:var(--vault-fg-muted)}
.kbd{font-family:var(--font-mono);font-size:10px;background:var(--vault-sunken);padding:2px 6px;border-radius:3px;border:1px solid var(--vault-rule);color:var(--vault-fg-muted);margin-left:auto}
</style></head><body><div class="wrap inner-shell">
<span class="tag">inputs</span>
<input type="text" placeholder="Title — Roman numerals welcome">
<input type="text" value="2026-04-25" disabled style="font-family:var(--font-mono);color:var(--vault-fg-muted)">
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><span>Search vault — title, tag, UID</span><span class="kbd">⌘K</span></div>
</div></body></html>
