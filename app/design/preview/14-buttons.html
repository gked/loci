<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--vault-bg);overflow:hidden}
.wrap{width:700px;padding:20px 28px;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--font-sans);color:var(--vault-fg)}
.btn{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;cursor:default;font-family:var(--font-sans)}
.primary{background:#15130f;color:#fff;border-color:#15130f}
.secondary{background:#fff;color:#15130f;border-color:var(--vault-rule)}
.ghost{background:transparent;color:#15130f}
.danger{background:#fff;color:#a4421f;border-color:#e2dfd7}
.terra{background:#a4421f;color:#f5efe2;border-color:#a4421f}
.kbd{font-family:var(--font-mono);font-size:11px;background:var(--vault-sunken);padding:2px 6px;border-radius:3px;border:1px solid var(--vault-rule);margin-left:4px;color:var(--vault-fg-muted)}
.tag{font-family:var(--font-sans);font-weight:600;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--vault-fg-muted);width:100%;margin-bottom:4px}
</style></head><body><div class="wrap inner-shell">
<span class="tag">buttons</span>
<button class="btn primary">Save locus</button>
<button class="btn secondary">Cancel</button>
<button class="btn ghost">Skip</button>
<button class="btn danger">Delete</button>
<button class="btn terra">Open vault</button>
<button class="btn secondary">Search<span class="kbd">⌘K</span></button>
</div></body></html>
