<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--vault-bg);overflow:hidden}
.wrap{width:700px;padding:24px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;font-family:var(--font-mono);font-size:12px;color:var(--vault-fg)}
.row{display:grid;grid-template-columns:140px 1fr 80px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--vault-rule)}
.row:last-child{border-bottom:0}
.k{color:var(--vault-fg-muted)}
.v{color:var(--vault-fg)}
.s{color:var(--vault-fg-faint);text-align:right}
.tag{font-family:var(--font-sans);font-weight:600;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--vault-fg-muted)}
</style></head><body><div class="wrap inner-shell">
<span class="tag">spacing scale · 8px base</span>
<div class="row"><span class="k">--s-1</span><span class="v" style="background:#e2dfd7;height:4px"></span><span class="s">4 px</span></div>
<div class="row"><span class="k">--s-2</span><span class="v" style="background:#e2dfd7;height:8px"></span><span class="s">8 px</span></div>
<div class="row"><span class="k">--s-3</span><span class="v" style="background:#e2dfd7;height:12px"></span><span class="s">12 px</span></div>
<div class="row"><span class="k">--s-4</span><span class="v" style="background:#e2dfd7;height:16px"></span><span class="s">16 px</span></div>
<div class="row"><span class="k">--s-5</span><span class="v" style="background:#e2dfd7;height:24px"></span><span class="s">24 px</span></div>
<div class="row"><span class="k">--s-6</span><span class="v" style="background:#e2dfd7;height:32px"></span><span class="s">32 px</span></div>
<div class="row"><span class="k">--s-7</span><span class="v" style="background:#e2dfd7;height:48px"></span><span class="s">48 px</span></div>
</div></body></html>
