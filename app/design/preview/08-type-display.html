<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--ivory);overflow:hidden}
.wrap{width:700px;padding:24px 36px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;color:var(--lampblack)}
.d{font-family:var(--font-display);font-weight:500;font-size:64px;line-height:1;letter-spacing:-0.01em}
.h1{font-family:var(--font-display);font-weight:500;font-size:32px;line-height:1.1}
.h2{font-family:var(--font-serif);font-weight:600;font-size:20px;line-height:1.2}
.lead{font-family:var(--font-serif);font-style:italic;font-size:15px;color:var(--bronze)}
.tag{font-family:var(--font-serif);font-feature-settings:"smcp" 1,"c2sc" 1;text-transform:lowercase;letter-spacing:0.18em;font-size:10px;color:var(--bronze);margin-bottom:4px}
</style></head><body><div class="wrap">
<span class="tag">display · cormorant garamond 500</span>
<div class="d">Memoria locorum</div>
<div class="h1">A place for everything</div>
<div class="h2">Headline · serif 20</div>
<div class="lead">Italic lead — earned gravitas, never fake.</div>
</div></body></html>
