<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--ivory);overflow:hidden}
.wrap{width:700px;padding:0;box-sizing:border-box;font-family:var(--font-serif);color:var(--ink);position:relative}
.plate{margin:18px 36px;border:1px solid var(--travertine);padding:6px}
.inner{border:1px solid var(--travertine);padding:18px 28px;display:flex;flex-direction:column;gap:8px}
.over{font-feature-settings:"smcp" 1,"c2sc" 1;text-transform:lowercase;letter-spacing:0.18em;font-size:10px;color:var(--bronze);text-align:center}
.t{font-family:var(--font-display);font-weight:500;font-size:34px;line-height:1.1;text-align:center;color:var(--lampblack)}
.s{font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--bronze);text-align:center}
.rule{height:1px;background:var(--travertine);margin:4px auto;width:40px}
</style></head><body><div class="wrap outer-shell">
<div class="plate"><div class="inner">
<span class="over">— de loci natura —</span>
<div class="t">A place for everything</div>
<div class="rule"></div>
<div class="s">framed plate · doubled hairline · no shadow</div>
</div></div></div></body></html>
