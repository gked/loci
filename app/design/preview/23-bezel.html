<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../instrument-shell.css"/>
<style>html,body{margin:0;padding:0;background:#060914;overflow:hidden}
.wrap{width:700px;height:380px;position:relative;font-family:var(--font-sans)}
</style></head>
<body class="instrument-shell">
<div class="wrap">
  <div class="canvas">
    <div class="meridian"></div>
    <div class="reticle"><i></i></div>
    <div class="corner tl"><i>kit · atom</i><b>bezel</b></div>
    <div class="corner tr" style="text-align:right"><i>nomen</i><b>engraved ring</b></div>
    <div style="position:absolute;inset:0;display:grid;place-items:center">
      <svg width="280" height="280" viewBox="-140 -140 280 280" style="overflow:visible">
        <g class="bezel-rotate" style="--bezel-dur:240s">
          <circle r="126" fill="none" stroke="var(--t-bronze-d)" stroke-width="0.6" opacity="0.7"/>
          <circle r="122" fill="none" stroke="var(--t-bronze-d)" stroke-width="0.4" opacity="0.5"/>
          <path id="bz-top" d="M -122,0 A 122,122 0 0,1 122,0" fill="none"/>
          <path id="bz-bot" d="M 122,0 A 122,122 0 0,1 -122,0" fill="none"/>
          <text font-family="var(--font-display)" font-style="italic" font-size="11"
                fill="var(--t-bronze)" letter-spacing="0.18em">
            <textPath href="#bz-top" startOffset="50%" text-anchor="middle">documentum · negotium · persona</textPath>
          </text>
          <text font-family="var(--font-display)" font-style="italic" font-size="11"
                fill="var(--t-bronze)" letter-spacing="0.18em">
            <textPath href="#bz-bot" startOffset="50%" text-anchor="middle">colloquium · articulus · signum</textPath>
          </text>
          <g font-family="var(--font-display)" font-size="11" fill="var(--t-bronze)">
            <text y="-116" text-anchor="middle">N</text>
            <text x="116" y="3.5">E</text>
            <text y="119" text-anchor="middle">S</text>
            <text x="-116" y="3.5" text-anchor="end">W</text>
          </g>
          <line x1="0" y1="-118" x2="0" y2="118"
            stroke="var(--t-bronze)" stroke-width="0.4" stroke-dasharray="1 4" opacity="0.5"/>
          <line x1="-118" y1="0" x2="118" y2="0"
            stroke="var(--t-bronze)" stroke-width="0.4" stroke-dasharray="1 4" opacity="0.5"/>
        </g>
        <text y="2" text-anchor="middle"
          font-family="var(--font-display)" font-style="italic" font-size="14"
          fill="var(--t-fg)" letter-spacing="0.18em">topologia</text>
      </svg>
    </div>
  </div>
</div>
</body></html>
