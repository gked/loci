<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--ivory);overflow:hidden}
.card{width:700px;height:220px;display:grid;grid-template-columns:240px 1fr;align-items:center;padding:0 36px;box-sizing:border-box;gap:32px}
.left{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--travertine);height:160px}
.right{display:flex;flex-direction:column;gap:8px}
.label{font-family:var(--font-serif);font-feature-settings:"smcp" 1,"c2sc" 1;text-transform:lowercase;letter-spacing:0.18em;font-size:10px;color:var(--bronze)}
.t{font-family:var(--font-display);font-size:18px;color:var(--ink);font-style:italic;font-weight:500}
.note{font-family:var(--font-serif);font-size:13px;color:var(--ink);line-height:1.5;text-wrap:pretty}
img{width:120px;height:120px}
</style></head><body><div class="card outer-shell">
<div class="left"><img src="../assets/logo/monogram.svg" alt=""></div>
<div class="right">
<span class="label">monogram</span>
<div class="t">L bound by Roman fret</div>
<div class="note">Roman labyrinth-key border, oxidized cinnabar locus dot. Scales square. Used as favicon, container icon, splash mark.</div>
</div></div></body></html>
