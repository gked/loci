<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../instrument-shell.css"/>
<style>html,body{margin:0;padding:0;background:#f5efe2;overflow:hidden}
.wrap{width:700px;height:380px;position:relative;font-family:var(--font-sans)}
</style></head>
<body class="instrument-shell">
<div class="wrap">
  <div class="canvas paper">
    <div class="meridian"></div>
    <div class="reticle"><i></i></div>
    <div class="corner tl"><i>genus</i><b>article</b></div>
    <div class="corner tr" style="text-align:right"><i>indicium</i><b>b6c80fde</b></div>
    <div class="corner bl"><i>natum</i><b>2025-11-04</b></div>
    <div class="corner br" style="text-align:right"><i>fol.</i><b>iii / xvii</b></div>

    <div style="position:absolute;inset:48px 64px;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-style:italic;font-size:11px;color:var(--t-bronze-d);letter-spacing:0.18em;text-transform:lowercase;margin-bottom:10px">
        <span class="t-dot" data-type="article"></span>
        <span>articulus · article</span>
        <span style="flex:1;border-top:0.5px solid currentColor;opacity:0.5"></span>
        <span style="font-family:var(--font-mono);font-style:normal;font-size:10px;letter-spacing:0.04em">b6c80fde</span>
      </div>
      <h1 style="font-family:var(--font-display);font-weight:500;font-size:38px;line-height:1.06;letter-spacing:-0.005em;margin:0 0 16px;color:var(--ink)">
        Attention is all you need.
      </h1>
      <p style="font-family:var(--font-serif);font-size:15px;line-height:1.65;color:var(--ink);margin:0;max-width:520px">
        <span style="font-family:var(--font-display);font-weight:500;font-size:3.6em;line-height:0.85;float:left;padding-right:10px;color:var(--terracotta)">V</span>aswani et al. The transformer architecture: self-attention without recurrence. Foundational for modern LLMs.
      </p>
    </div>
  </div>
</div>
</body></html>
